
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devang Bajpai</title>
    <style>
        :root {
            --bg: #fafaf8;
            --text: #1a1a1a;
            --muted: #666;
            --accent: #2c5282;
            --border: #e2e2de;
            --section-bg: #fff;
            --hover: #1a365d;
            --tag-bg: #edf2f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 17px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.15s;
        }
        a:hover { color: var(--hover); }

        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            background: rgba(250, 250, 248, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 0 2rem;
        }
        nav .nav-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 2rem;
            height: 52px;
            overflow-x: auto;
        }
        nav .nav-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text);
            white-space: nowrap;
            letter-spacing: 0.02em;
        }
        nav a {
            color: var(--muted);
            font-size: 0.9rem;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        nav a:hover { color: var(--text); }
        nav a.active { color: var(--text); font-weight: 500; }

        /* Main content */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem 6rem;
        }

        /* Header/Hero */
        .hero {
            margin-bottom: 4rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 0.8rem;
            letter-spacing: 0.02em;
        }
        .hero .affiliation {
            color: var(--muted);
            font-size: 1.05rem;
            margin-bottom: 1rem;
        }
        .hero .bio {
            font-size: 1.05rem;
            max-width: 600px;
        }
        .hero .links {
            margin-top: 1rem;
            font-size: 0.95rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .hero .links a {
            margin-right: 1.5rem;
            color: var(--muted);
        }
        .hero .links a:hover { color: var(--accent); }

        /* Sections */
        section {
            margin-bottom: 3.5rem;
        }
        section h2 {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            letter-spacing: 0.02em;
        }

        /* Paper topics */
        .topic {
            margin-bottom: 0;
        }
        .topic summary {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            cursor: pointer;
            padding: 0.6rem 0;
            border-bottom: 1px solid #f0f0ec;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .topic summary::-webkit-details-marker { display: none; }
        .topic summary::before {
            content: '›';
            display: inline-block;
            font-size: 1.2rem;
            color: var(--muted);
            transition: transform 0.2s;
            width: 0.8rem;
        }
        .topic[open] summary::before {
            transform: rotate(90deg);
        }
        .topic summary:hover { color: var(--accent); }
        .topic .topic-count {
            font-size: 0.82rem;
            color: var(--muted);
            font-weight: 400;
        }
        .topic h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .paper-list {
            list-style: none;
            padding: 0;
        }
        .paper-list li {
            padding: 0.45rem 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .paper-list li + li {
            border-top: 1px solid #f0f0ec;
        }
        .paper-title {
            font-style: italic;
        }
        .paper-authors {
            color: var(--muted);
            font-size: 0.88rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .paper-arxiv {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.82rem;
            color: var(--accent);
        }

        /* Notes list */
        .notes-list {
            list-style: none;
            padding: 0;
        }
        .notes-list li {
            padding: 0.6rem 0;
            font-size: 1rem;
        }
        .notes-list li + li {
            border-top: 1px solid #f0f0ec;
        }
        .note-desc {
            color: var(--muted);
            font-size: 0.9rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Talks */
        .talks-list {
            list-style: none;
            padding: 0;
        }
        .talks-list li {
            padding: 0.5rem 0;
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* Responsive */
        @media (max-width: 640px) {
            main { padding: 2rem 1.2rem 4rem; }
            .hero h1 { font-size: 1.8rem; }
            nav .nav-inner { gap: 1.2rem; padding: 0; }
            nav { padding: 0 1.2rem; }
        }

        /* Smooth scroll */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>

<nav>
    <div class="nav-inner">
        <span class="nav-name">Devang Bajpai</span>
        <a href="/papers.html">Selected Papers</a>
        <a href="/qft-notes.html">QFT Notes</a>
        <a href="/misc.html">Miscellaneous</a>
    </div>
</nav>

<main>

<div class="hero" id="home">
    <h1>Devang Bajpai</h1>
     <img id="profile" src="devang.png" alt="Devang Bajpai">
    <div class="bio">
        Theoretical physicist interested in Quantum Field Theory, String Theory, and Mathematical Physics.
    </div>
    <div class="links" style="margin-top: 1.2rem;">
        <a href="https://bajpaidevang.blogspot.com/?m=1/">Blog</a>
        <a href="https://sites.google.com/view/devangbajpai/home/">Other Webpage</a>
        <a href="https://x.com/_devangbajpai_/">Twitter</a>
        <a href="https://github.com/bajpaidevang">GitHub</a>
    </div>
</div>

</main>

</body>
</html>
